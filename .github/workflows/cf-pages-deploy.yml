name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deployment
        run: |
          echo "Triggering Cloudflare Pages deployment..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/e3775d58-a946-4690-a74d-78cce56ee2ce"
